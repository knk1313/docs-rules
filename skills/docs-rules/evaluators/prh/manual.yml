# 手で書く辞書。rules/ の語の置き換えで判定できるルールを置く。
# prh の項目にルールIDを書く。score.mjs はtextlintのメッセージの末尾からルールIDを読む。
version: 1
rules:

  # FW-002 動作を表す名詞に「〜を実施する」「〜を行う」を付けない。
  # 名詞が動作を表すかは見分けられないため、「〜を行う」の形をすべて指摘する。活用は「する」「し」の2つの形に直す
  - expected: "$1する"
    pattern: "/([一-龯々ァ-ヺー]{2,})を(?:行う|実施する)/"
    prh: FW-002
    specs:
      - from: "動作確認を行う"
        to: "動作確認する"
      - from: "調査を実施する"
        to: "調査する"
  - expected: "$1し"
    pattern: "/([一-龯々ァ-ヺー]{2,})を(?:行い|行っ|行わ|実施し)/"
    prh: FW-002
    specs:
      - from: "動作確認を行った"
        to: "動作確認した"
      - from: "調査を行います"
        to: "調査します"
      - from: "レビューを実施して"
        to: "レビューして"
      - from: "確認を行わない"
        to: "確認しない"
