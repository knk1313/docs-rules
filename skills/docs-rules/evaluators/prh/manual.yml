        to: "アダプター"
  - expected: "インストーラー"
    pattern: "/(?<![ァ-ヺー])インストーラ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "インストーラ"
        to: "インストーラー"
  - expected: "クラスター"
    pattern: "/(?<![ァ-ヺー])クラスタ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "クラスタ"
