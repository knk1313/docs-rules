# 手で書く辞書。rules/ の語や文字の置き換えで判定できるルールを置く。
# prh の項目にルールIDを書く。score.mjs はtextlintのメッセージの末尾からルールIDを読む。
# 外来語（NOT-011）の辞書は data/tools/build_prh.py で生成し、別のファイルに置く。
# 送り仮名（NOT-010）は、文書の中の混在を custom-rules/not-010.js で判定する。
# 繰り返し符号（NOT-004）は、濁点の付いた符号も直すため custom-rules/not-004.js で判定する。
version: 1
rules:

  # FW-002 動作を表す名詞に「〜を実施する」「〜を行う」を付けない。
  # 名詞が動作を表すかは見分けられないため、「〜を行う」の形をすべて指摘する。活用は「する」「し」の2つの形に直す
  - expected: "$1する"
    pattern: "/([一-龯々ァ-ヺー]{2,})を(?:行う|実施する)/"
    prh: FW-002
    specs:
      - from: "動作確認を行う"
        to: "動作確認する"
      - from: "調査を実施する"
        to: "調査する"
  - expected: "$1し"
    pattern: "/([一-龯々ァ-ヺー]{2,})を(?:行い|行っ|行わ|実施し)/"
    prh: FW-002
    specs:
      - from: "動作確認を行った"
        to: "動作確認した"
      - from: "調査を行います"
        to: "調査します"
      - from: "レビューを実施して"
        to: "レビューして"
      - from: "確認を行わない"
        to: "確認しない"

  # NOT-008 接続詞と副詞は仮名で書く。接続詞は名詞の直後に来るため、前の字では除かない。
  # 「更に」だけは、前に漢字が続くとき（「変更に」）を語の一部として除く
  - expected: "さらに"
    pattern: "/(?<![一-龯々])更に/"
    prh: NOT-008
    specs:
      - from: "更に設定を変える"
        to: "さらに設定を変える"
      - from: "変更に従う"
        to: "変更に従う"
  - expected: "しかし"
    pattern: "/然し/"
    prh: NOT-008
    specs:
      - from: "然し"
        to: "しかし"
  - expected: "ただし"
    pattern: "/但し/"
    prh: NOT-008
    specs:
      - from: "但し"
        to: "ただし"
  - expected: "いろいろ"
    pattern: "/色々/"
    prh: NOT-008
    specs:
      - from: "色々な設定"
        to: "いろいろな設定"
  - expected: "たくさん"
    pattern: "/沢山/"
    prh: NOT-008
    specs:
      - from: "沢山ある"
        to: "たくさんある"
  - expected: "ちょうど"
    pattern: "/丁度/"
    prh: NOT-008
    specs:
      - from: "丁度よい"
        to: "ちょうどよい"
  # 「従って」「尚」は、文の初めで読点が続くときだけ接続詞とみなす。動詞の「規則に従って」は除く
  - expected: "したがって、"
    pattern: "/(?<![^。\\s])従って、/"
    prh: NOT-008
    specs:
      - from: "従って、確かめる"
        to: "したがって、確かめる"
      - from: "規則に従って、確かめる"
        to: "規則に従って、確かめる"
  - expected: "なお、"
    pattern: "/(?<![^。\\s])尚、/"
    prh: NOT-008
    specs:
      - from: "尚、読めない"
        to: "なお、読めない"
  # 「出来事」「出来高」のように後ろに漢字が続く語は除く。「変更出来る」のように前に漢字が続く形は対象にする
  - expected: "でき"
    pattern: "/出来(?![一-龯々])/"
    prh: NOT-008
    specs:
      - from: "変更出来る"
        to: "変更できる"
      - from: "出来事"
        to: "出来事"
  - expected: "および"
    # 動詞の「及ぶ」の連用形（「被害が及び」）は除く
    pattern: "/(?<![がにもは])及び/"
    prh: NOT-008
    specs:
      - from: "被害が及び"
        to: "被害が及び"
      - from: "設定及び手順"
        to: "設定および手順"
  - expected: "または"
    pattern: "/又は/"
    prh: NOT-008
    specs:
      - from: "設定又は手順"
        to: "設定または手順"
  - expected: "ならびに"
    pattern: "/並びに/"
    prh: NOT-008
    specs:
      - from: "設定並びに手順"
        to: "設定ならびに手順"
  - expected: "もしくは"
    pattern: "/若しくは/"
    prh: NOT-008
    specs:
      - from: "設定若しくは手順"
        to: "設定もしくは手順"

  # NOT-016 「か所」「か月」は仮名の「か」で書く。数字の後の「ヶ」はjtf-style/2.2.3が判定する。
  # 数を数える場合だけが対象のため、「該当箇所」のような名詞の「箇所」は除く
  - expected: "か"
    pattern: "/(?<=[0-9０-９何数])[箇ケカヵ](?=[所月国年])/"
    prh: NOT-016
    specs:
      - from: "2箇所"
        to: "2か所"
      - from: "3ケ月"
        to: "3か月"
      - from: "2カ所"
        to: "2か所"
      - from: "該当箇所"
        to: "該当箇所"
  - expected: "か"
    pattern: "/(?<=[何数])ヶ(?=[所月国年])/"
    prh: NOT-016
    specs:
      - from: "数ヶ月"
        to: "数か月"

  # NOT-025 波線は「〜」（U+301C）にそろえる。「～」（U+FF5E）はjtf-style/4.2.5.波線(〜)が検出しない
  - expected: "〜"
    pattern: "～"
    prh: NOT-025
    specs:
      - from: "1～3"
        to: "1〜3"

  # NOT-027 和文ではセミコロンを使わない。全角の「；」はjtf-style/4.2.8.セミコロン(;)が検出しない。
  # 項目を並べる「；」は読点に直すのがよいが、見分けられないため、文を分ける句点を候補にする
  - expected: "。"
    pattern: "；"
    prh: NOT-027
    specs:
      - from: "足りない；消せない"
        to: "足りない。消せない"

  # NOT-011 外来語の語末の長音符号を省かない。告示の用例集にない語のうち、技術文書でよく使う語を手で足す（#67）。
  # 用例集の語は gairaigo.yml にある。「メモリ」「ディレクトリ」のように語末が「リ」の語は、省いた形が広く定着しているため入れない。
  # 前後に片仮名が続くとき（「ユーザビリティ」「フィルタリング」）は別の語の一部として扱う
  - expected: "サーバー"
    pattern: "/(?<![ァ-ヺー])サーバ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "サーバ"
        to: "サーバー"
  - expected: "ユーザー"
    pattern: "/(?<![ァ-ヺー])ユーザ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "ユーザ"
        to: "ユーザー"
      - from: "ユーザビリティ"
        to: "ユーザビリティ"
  - expected: "フォルダー"
    pattern: "/(?<![ァ-ヺー])フォルダ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "フォルダ"
        to: "フォルダー"
  - expected: "プリンター"
    pattern: "/(?<![ァ-ヺー])プリンタ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "プリンタ"
        to: "プリンター"
  - expected: "ブラウザー"
    pattern: "/(?<![ァ-ヺー])ブラウザ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "ブラウザ"
        to: "ブラウザー"
  - expected: "スキャナー"
    pattern: "/(?<![ァ-ヺー])スキャナ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "スキャナ"
        to: "スキャナー"
  - expected: "ドライバー"
    pattern: "/(?<![ァ-ヺー])ドライバ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "ドライバ"
        to: "ドライバー"
  - expected: "パラメーター"
    pattern: "/(?<![ァ-ヺー])パラメータ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "パラメータ"
        to: "パラメーター"
  - expected: "エディター"
    pattern: "/(?<![ァ-ヺー])エディタ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "エディタ"
        to: "エディター"
  - expected: "レイヤー"
    pattern: "/(?<![ァ-ヺー])レイヤ(?![ァ-ヺー])/"
    prh: NOT-011
    specs:
      - from: "レイヤ"
        to: "レイヤー"
  - expected: "マネージャー"
    pattern: "/(?<![ァ-ヺー])マネージャ(?![ァ-ヺー])/"
    prh: NOT-011
