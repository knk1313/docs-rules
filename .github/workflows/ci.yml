name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定ではすべての権限を外し、ジョブごとに必要なものだけを付ける
permissions: {}

# アクションはタグではなくコミットのSHAで固定する。タグは作者側で付け替えられるため。
# 行末のコメントは、そのSHAに当たる版。版上げはDependabotがSHAとコメントを合わせて行う

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # リポジトリの取得にだけ使う
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: SKILL.mdの大きさ
        run: python3 tests/test_skill_size.py
      # score.mjs は初回の実行で package-lock.json の版のとおりにパッケージを入れる。
      # テストは採点を並行して実行するため、入れる処理が重ならないよう、先に一度だけ入れておく。
      # score.mjs の終了コードは、違反なしが0、違反ありが1。入れられなかった3はこのステップを失敗にする
      - name: 採点で使うパッケージを先に入れる
        run: node skills/docs-rules/evaluators/score.mjs README.md > /dev/null || [ $? -eq 1 ]
      # repo-lint.test.mjs は score.mjs で採点し、markdownlint-cli2 は npx で取得してリポジトリ全体に当てる
      - name: rules・schemas・templatesの整合と、Markdownの採点
        run: node --test tests/*.test.mjs

  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Claude Codeの版はplugin-validate/package-lock.jsonで固定し、Dependabotが版上げのPRを出す
      - name: 検証で使うClaude Codeを入れる
        run: npm ci --no-audit --no-fund
        working-directory: .github/plugin-validate
      # 警告はエラーにしない（CONTRIBUTING.mdの「プラグイン配布の検証」）。版を上げるときは警告の内容を見直す
      - name: プラグインのマニフェストの検証
        run: .github/plugin-validate/node_modules/.bin/claude plugin validate .
