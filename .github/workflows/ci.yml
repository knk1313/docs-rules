name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定ではすべての権限を外し、ジョブごとに必要なものだけを付ける
permissions: {}

# アクションはタグではなくコミットのSHAで固定する。タグは作者側で付け替えられるため。
# 行末のコメントは、そのSHAに当たる版。版上げはDependabotがSHAとコメントを合わせて行う

jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Claude Codeの版はci/plugin-validate/package-lock.jsonで固定し、Dependabotが版上げのPRを出す
      - name: 検証で使うClaude Codeを入れる
        run: npm ci --no-audit --no-fund
        working-directory: ci/plugin-validate
      # 警告はエラーにしない（AGENTS.mdの「プラグイン配布の検証」）。版を上げるときは警告の内容を見直す
      - name: プラグインのマニフェストの検証
        run: ci/plugin-validate/node_modules/.bin/claude plugin validate .
