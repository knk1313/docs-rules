name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定ではすべての権限を外し、ジョブごとに必要なものだけを付ける
permissions: {}

# アクションはタグではなくコミットのSHAで固定する。タグは作者側で付け替えられるため。
# 行末のコメントは、そのSHAに当たる版。版上げはDependabotがSHAとコメントを合わせて行う

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # リポジトリの取得にだけ使う
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: SKILL.mdの大きさ
        run: python3 tests/test_skill_size.py
      # テストは採点を並行して実行する。npx のキャッシュが空のまま並行して取得すると、
      # 同じ場所への取得が競合してパッケージが欠けるため、先に一度だけ取得しておく。
      # score.mjs の終了コードは、違反なしが0、違反ありが1。取得に失敗した3はこのステップを失敗にする
      - name: 採点で使うパッケージを先に取得する
        run: node skills/docs-rules/evaluators/score.mjs README.md > /dev/null || [ $? -eq 1 ]
      # repo-lint.test.mjs は npx で textlint と markdownlint-cli2 を取得し、evaluators/ で採点する
      - name: rules・schemas・templatesの整合と、Markdownの採点
        run: node --test tests/*.test.mjs

  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 警告はエラーにしない（CONTRIBUTING.mdの「プラグイン配布の検証」）。版を上げるときは警告の内容を見直す
      - name: プラグインのマニフェストの検証
        run: npx -y @anthropic-ai/claude-code@2.1.309 plugin validate .
